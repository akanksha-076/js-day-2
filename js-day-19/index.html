<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .LIGHT{
            background: white;
            color:black     
        }
        .DARK{
            background: black;
            color:white;
        }
        button{
            padding: 10px 20px;
            color: rgb(38, 49, 49);
        }
    </style>
</head>
<body >
    <h1>select your theme</h1>
    <button onclick="setTheme('LIGHT')" >LIGHT</button>
    <button onclick="setTheme('DARK')">DARK</button>
    <script>
        const savetheme=localStorage.getItem("x");
        if (savetheme){
            document.body.className=savetheme;
        }
        function setTheme(mode){
            document.body.className=mode;
            localStorage.setItem("x",mode);
        }
        
    </script>
</body>
</html>
