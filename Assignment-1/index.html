<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">🎯 Smart Event Dashboard</h1>

    <div class="container">

        
        <div class="box">
            <h2>Add New Event</h2>

            <label>Event Title</label>
            <input type="text">

            <label>Event Date</label>
            <input type="date">

            <label>Category</label>
            <input type="text" placeholder="">
            <select name="" id="">
                <option value="">1</option>
                <option value="">2</option>
            </select>

            <label>Description</label>
            <textarea rows="3"></textarea>

            <button>Add Event</button>
        </div>

        
        <div class="box sec">
            <h2>My Events</h2>

            <div class="btn-group">
                <button class="secondary">Clear All Events</button>
                <button class="secondary">Add Sample Events</button>
            </div>

            <p class="empty-text">No events yet. Add your first event!</p>
        </div>

    </div>

    <!-- DOM Manipulation Demo -->
    <div class="box dom-box">
        <h2>DOM Manipulation Demo</h2>
        <input type="text" placeholder="You Pressed:">
    </div>

</body>
</html>
